function pickSurface(x, y) {
  const rect = canvas.getBoundingClientRect();
  touchPoint.set(2*(x-rect.left)/rect.width-1, 1-2*(y-rect.top)/rect.height);
  camera.updateWorldMatrix(true, false);
  root.updateWorldMatrix(true, true);
  touchRay.setFromCamera(touchPoint, camera);
  const leila = touchRay.intersectObjects(parts, false)[0];
  const target = touchRay.intersectObjects(pickableDestinations, false)
    .find(hit => destinationMeshes.get(hit.object) !== sofaTarget || floorGroup.visible);
  return target && (!leila || target.distance < leila.distance)
    ? {destination:destinationMeshes.get(target.object)} : {leila};
}

function identifyBodyPart(hit) {
  const joint = hit.object.parent;
  const key = rigKeys.get(joint);
  const limb = limbLabels[key.slice(0,-1)];
  if (limb) {
    const left = key.endsWith('P');
    return {id:key, label:(left ? '左' : '右') + limb};
  }

  // Undo the current pose for subdivisions on the same rigid mesh.
  joint.worldToLocal(restPoint.copy(hit.point));
  const [, offsetX, offsetY, offsetZ] = defs[key];
  const x = restPoint.x + offsetX;
  const y = restPoint.y + offsetY;
  const z = restPoint.z + offsetZ;
  const side = x >= 0 ? 'Left' : 'Right';
  const sideLabel = x >= 0 ? '左' : '右';
  const width = Math.abs(x);

  switch (key) {
    case 'neck':
      return z < .008 ? {id:'backHead', label:'後頭部'} : {id:'face', label:'顔中央'};
    case 'head':
      if (y > .939) return {id:'crown', label:'頭頂'};
      if (width > .052 && z > -.054) return {id:'temple'+side, label:sideLabel+'側頭装甲'};
      if (z < .011) return {id:'backHead', label:'後頭部'};
      if (width > .019 && y < .872) return {id:'cheek'+side, label:sideLabel+'頬'};
      return {id:'face', label:'顔中央'};
    case 'chest':
      return z < .020 ? {id:'upperBack', label:'背中上部'} : {id:'chest', label:'胸部装甲'};
    case 'abdomen':
      if (z < .027 && y > .66) return {id:'upperBack', label:'背中上部'};
      if (width > .024) return {id:'flank'+side, label:sideLabel+'脇腹'};
      return z < .027 ? {id:'waist', label:'腰まわり'} : {id:'abdomen', label:'腹部'};
    case 'pelvis':
      if (z < .017 && y < .606 && width > .008) {
        return {id:'buttock'+side, label:sideLabel+'臀部'};
      }
      return {id:'waist', label:'腰まわり'};
  }
}

function moodSituation() {
  if ((mode === 'dance' && !dance.finished) || (mode === 'roam' && roam.phase === 'route')) return 'focused';
  if (mode === 'roam' && roam.phase === 'seated' &&
      (lastWorldMinute >= 22*60 || lastWorldMinute < 6*60)) return 'sleepy';
  return 'free';
}
function weightedChoice(choices) {
  let roll = Math.random()*choices.reduce((sum,[,weight]) => sum+weight,0);
  for (const [key,weight] of choices) {
    roll -= weight;
    if (roll < 0) return key;
  }
  return choices.at(-1)[0];
}
function setMood(next) {
  if (next === mood.current) return;
  mood.current = next;
  mood.age = 0;
  mood.nextChange = 120+Math.random()*180;
}
function updateMood(dt) {
  mood.seconds += dt;
  mood.age += dt;
  mood.positive = Math.max(0,mood.positive-dt/110);
  if (mood.current === 'annoyed' && mood.age >= 60) {
    setMood('neutral');
  } else if (mood.age >= mood.nextChange && moodSituation() !== 'focused') {
    const quiet = mood.seconds-mood.lastContact > 95;
    const next = weightedChoice([
      ['neutral',5],['happy',1+3*mood.positive],['affectionate',quiet ? 4 : 2],
      ['bored',quiet ? 5 : 1],['playful',2]
    ]);
    setMood(next);
    if (mood.age >= mood.nextChange) mood.nextChange = mood.age+65;
  }
  if ($('developer').open) {
    const state = moodSituation();
    const text = '現在の気分 ／ '+moodLabels[currentMood()]+
      (state === 'focused' ? '・集中中' : state === 'sleepy' ? '・眠い' : '');
    if (moodStatus.textContent !== text) moodStatus.textContent = text;
  }
}
function enjoyContact(preference, strength) {
  const age = mood.seconds-(mood.preferredAt.get(preference) ?? -Infinity);
  mood.preferredAt.set(preference,mood.seconds);
  mood.positive = Math.min(2,mood.positive+strength*Math.min(1,age/35));
  if (mood.positive >= .75 && mood.age >= 18 && mood.seconds >= mood.avoidedUntil) {
    setMood(currentMood() === 'affectionate' ? 'affectionate' : 'happy');
    mood.positive *= .5;
  }
}
function scheduleSocialFollowUp(seconds) {

}

  const repeatedFlank = flank && action === 'tap' && mood.seconds-mood.flankAt < 3.5;
  const crownStroke = action === 'drag' && id === 'crown';
  const feeling = currentMood();
  const situation = moodSituation();
  const rear = offered ? null : rearHitRegion(id,current.hit);
  const moving = situation === 'focused' || ['walk','mixamo','travel'].includes(mode);
  mood.lastContact = mood.seconds;
  if (flank && action === 'tap') mood.flankAt = mood.seconds;
  if (repeatedFlank || nape && action === 'hold') {
    const alreadyAvoiding = mood.seconds < mood.avoidedUntil;
    mood.avoidedUntil = mood.seconds+(alreadyAvoiding ? 15 : 5);
    if (alreadyAvoiding) setMood('annoyed');
    scheduleSocialFollowUp(15);
    if (!rear) {
      beginReaction(situation === 'focused' ? 'softGlance' : flank ? 'hipDodge' : 'flinch',true,side);
      return;
    }
  }
  if (rear) {
    const kind = rearContactKind(rear,action,feeling,moving,nape);
    beginReaction(kind,true,findRearSide(current.hit,side),action === 'drag',action === 'drag' ? current : null);
    return;
  }
  if (mood.seconds < mood.avoidedUntil && (flank || nape)) {
    beginReaction('softGlance',true,side);
    return;
  }
  if (crownStroke || offered) {
    enjoyContact(offered ? 'offeredHand' : 'crown',offered ? 1 : .8);
    if (offered) {
      mood.offeredHand = null;
      scheduleSocialFollowUp(12);
    }
  }
  let choices;
  if (offered) choices = [['handReply',1]];
  else if (hand || forearm) {
    beginReaction(armContactKind(action,feeling,moving,hand),true,side,action === 'drag');
    return;
  }
  else if (situation === 'focused') choices = [['softGlance',4],['nod',1]];
  else if (flank && action === 'tap') choices = [['hipDodge',1]];
  else if (head && (action === 'drag' || cheek)) {
    choices = {
      neutral:[['tilt',4],['softGlance',1]],
      happy:[['leanIn',5],['tilt',1]],
      affectionate:[['lingerLean',5],['leanIn',1]],
      bored:[['beckon',3],['tilt',2]],
      playful:[['dodge',5],['tilt',1]],
      annoyed:[['withdraw',5],['softGlance',1]]
    }[feeling];
    if (situation === 'sleepy') choices = [[feeling === 'annoyed' ? 'withdraw' : 'tilt',1]];
  } else if (shoulder || head) {
    choices = feeling === 'annoyed' ? [['softGlance',1]] : [['look',3],['nod',2]];
  } else {
    choices = feeling === 'playful' ? [['look',3],['beckon',2]]
      : feeling === 'annoyed' || situation === 'sleepy' ? [['softGlance',1]]
      : [['smallWave',3],['nod',2],['look',1]];
  }
  beginReaction(weightedChoice(choices),true,side,action === 'drag');
}

// Capture phase lets OrbitControls keep tracking both fingers for pinch while
// disabling its single-finger rotation when the first finger touches Leila.
canvas.addEventListener('pointerdown', event => {
  trackedPointers.add(event.pointerId);
  if (trackedPointers.size > 1) {
    clearContact();
    backgroundTap = null;
    return;
  }
  if (!event.isPrimary || event.button !== 0) return;
  const {clientX:x, clientY:y, pointerId:id} = event;
  const {leila} = pickSurface(x, y);
  if (!leila) {
    backgroundTap = {id,x,y};
    return;
  }
  const part = identifyBodyPart(leila);
  const offer = mood.offeredHand;
  const offeredHand = offer && reaction?.kind === 'offerHand' &&
    (part.id === 'hand'+offer.side || part.id === 'fore'+offer.side) &&
    mood.seconds <= offer.until ? offer : null;
  const started = {id,x,y,hit:leila,path:[part],action:null,lastSample:-Infinity,offeredHand};
  if (offeredHand && reaction?.kind === 'offerHand') {
    reaction.duration = Math.max(reaction.duration,reaction.elapsed+.65);
    offeredHand.until = mood.seconds+reaction.duration-reaction.elapsed;
  }
  contact = started;
  orbit.mouseButtons.LEFT = -1;
  orbit.touches.ONE = -1;
  started.timer = setTimeout(() => {
    if (contact !== started || started.action) return;
    started.action = 'hold';
    reportTouch('hold', started);
    respondToContact('hold', started);
  }, touchHold);
}, true);

function updateDrag(event, current, finish = false) {
  if (current.action === 'hold') {
    if (!finish) moveHeldHand(event,current);
    return;
  }
  if (!current.action) {
    if (Math.hypot(event.clientX-current.x, event.clientY-current.y) <= touchMotion) return;
    clearTimeout(current.timer);
    current.action = 'drag';
    reportTouch('drag', current);
    if (!finish) current.timer = setTimeout(() => {
      if (contact === current) respondToContact('drag', current);
    }, touchHold);
  }
  if (!finish && event.timeStamp-current.lastSample < 32) return;
  current.lastSample = event.timeStamp;
  const {leila} = pickSurface(event.clientX, event.clientY);
  const part = leila && identifyBodyPart(leila);
  if (!part || part.id === current.path.at(-1).id) {
    current.pending = null;
    return;
  }
  if (finish || current.pending === part.id) {
    current.path.push(part);
    current.pending = null;
    reportTouch('drag', current);
  } else {
    current.pending = part.id;
  }
}

canvas.addEventListener('pointermove', event => {
  if (contact?.id === event.pointerId) updateDrag(event, contact);
  if (backgroundTap?.id === event.pointerId &&
      Math.hypot(event.clientX-backgroundTap.x,event.clientY-backgroundTap.y) > touchMotion) {
    backgroundTap = null;
  }
});

function endPointer(event) {
  trackedPointers.delete(event.pointerId);
  const current = contact?.id === event.pointerId ? contact : null;
  const origin = backgroundTap?.id === event.pointerId ? backgroundTap : null;
  if (origin) backgroundTap = null;
  if (current) clearContact();
  if (event.type !== 'pointerup') return;
  if (current) {
    updateDrag(event, current, true);
    if (!current.action) {
      reportTouch('tap', current);
      respondToContact('tap', current);
    }
  } else if (origin && mode === 'roam' &&
      Math.hypot(event.clientX-origin.x,event.clientY-origin.y) <= touchMotion) {
    const {destination} = pickSurface(event.clientX, event.clientY);
    if (destination) {
      restoreReactionPose();
      requestDestination(destination, true);
    }
  }
}

for (const type of ['pointerup','pointercancel','lostpointercapture']) {
  canvas.addEventListener(type, endPointer, true);
}
canvas.addEventListener('contextmenu', event => event.preventDefault());
window.addEventListener('blur', () => {
  trackedPointers.clear();
  backgroundTap = null;
  clearContact();
});

const reactions = {
  ...rearReactions,
  ...armReactions,
  softGlance:{label:'こちらに目を向けています',duration:.80,pose:'glance'},
  tilt:{label:'首をかしげています',duration:1.25,pose:'tilt'},
  leanIn:{label:'頬を寄せています',duration:1.55,pose:'lean'},
  lingerLean:{label:'頬を寄せて見上げています',duration:2.25,pose:'lean'},
  dodge:{label:'ひょいと頭を引いています',duration:1.48,pose:'dodge'},
  withdraw:{label:'そっと頭を引いています',duration:1.34,pose:'withdraw'},
  flinch:{label:'肩をすくめています',duration:1.05,pose:'flinch'},
  hipDodge:{label:'腰を引いてよけています',duration:1.15,pose:'hipDodge'},
  offerHand:{label:'手を差し出しています',duration:.22+10+.35,pose:'hand'},
  handReply:{label:'差し出した手にもう片方の手を重ねています',duration:2.05,pose:'hand'},
  look: {label:'こちらを振り向いています',duration:1.48,clip:'look'},
  nod: {label:'うなずいています',duration:1.24,clip:'nod'},
  smallWave: {label:'小さく手を振っています',duration:1.70,clip:'greeting'},
  largeWave: {label:'大きく手を振っています',duration:2.22,clip:'greeting'},
  beckon: {label:'手招きしています',duration:1.67,clip:'beckon'},
  welcome: {label:'近づいたあなたに、うれしそうにうなずきました',duration:1.32,clip:'nod'}
};
const hipReactionJoints = ['pelvis','abdomen','thighP','kneeP','shinP','footP','thighN','kneeN','shinN','footN']
  .map(key => ({key,joint:groups[key],pose:new T.Quaternion()}));
const hipPosition = new T.Vector3();
const hipFeet = [new T.Vector3(),new T.Vector3()];
let hipReactionApplied = false;
const handTarget = new T.Vector3();
const handBend = new T.Vector3();
const handView = new T.Vector3();
const palmUp = V(0,1,0);
const palmDown = V(0,-1,0);
const palmForward = new T.Vector3();
const offeredPalm = new T.Vector3();
const coverPalm = new T.Vector3();
const coverWrist = new T.Vector3();
const palmBasis = new T.Matrix4();
const palmAcross = new T.Vector3();
const desiredHandRotation = new T.Quaternion();

// Palm surface centers and axes measured in the model's original wrist space.
const palmRig = Object.fromEntries(['P','N'].map(side => {
  const sign = side === 'P' ? 1 : -1;
  const fingers = V(sign*.40,-.916,0).normalize();
  const normal = V(-sign*.916,-.40,0).normalize();
  const rest = new T.Quaternion().setFromRotationMatrix(
    palmBasis.makeBasis(fingers,normal,V(0,0,0).crossVectors(fingers,normal))).invert();
  return [side,{center:V(sign*.007,-.028,.002),rest}];
}));
const reactionJoints = ['chest','neck','head','upperN','elbowN','foreN','handN','upperP','elbowP','foreP','handP']
  .map(key => ({joint:groups[key],pose:new T.Quaternion()}));
let reaction = null;
let reactionApplied = false;
const reactionHeading = new T.Quaternion();
const gestureSample = Array.from({length:3},()=>new T.Quaternion());
const gestureAdjustment = new T.Quaternion();
const gestureLocal = new T.Quaternion();
const gestureEuler = new T.Euler(0,0,0,'YXZ');
const gestureRoll = new T.Vector3(0,0,1);
const neutralRotation = new T.Quaternion();
let gestureClips;
let invitation = null;
const invitationFocus = new T.Vector3();

function watchForApproach() {
  if (!invitation) return;
  if (performance.now() > invitation.expires) {
    invitation = null;
    return;
  }
  const radius = camera.position.distanceTo(orbit.target);
  const inward = invitation.radius - radius;
  groups.chest.getWorldPosition(invitationFocus);
  // Evaluate both camera positions against the same current spot on Leila.
  const closer = invitation.camera.distanceTo(invitationFocus) - camera.position.distanceTo(invitationFocus);
  invitation.radius = radius;
  invitation.camera.copy(camera.position);
  // Orbiting and camera follow preserve the orbit radius.
  if (Math.abs(inward) < .0001) return;
  invitation.closing = Math.max(0,invitation.closing + Math.min(inward,closer));
  if (invitation.closing < invitation.threshold) return;

  invitation = null;
  mood.lastContact = mood.seconds;
  enjoyContact('beckon',1);
  scheduleSocialFollowUp(18);
  if (reaction?.kind === 'beckon') {
    const finish = Math.max(.62,reaction.elapsed+.35);
    reaction.duration = Math.min(reaction.duration,finish);
    reaction.next = 'welcome';
    reaction.nextSide = undefined;
  } else {
    restoreReactionPose();
    beginReaction('welcome',true);
  }
}

orbit.addEventListener('change',watchForApproach);

function restoreReactionPose() {
  if (!reactionApplied) return;
  for (const {joint,pose} of reactionJoints) joint.quaternion.copy(pose);
  if (hipReactionApplied) {
    groups.pelvis.position.copy(hipPosition);
    for (const {joint,pose} of hipReactionJoints) joint.quaternion.copy(pose);
    hipReactionApplied = false;
  }
  reactionApplied = false;
}

function beginReaction(kind,fromTap=false,touchSide,fromStroke=false,strokeContact=null) {
  // Keep taps distinct without restarting a gesture on every rapid touch.
  if (reaction?.pose === 'rear' && fromTap && kind !== 'welcome') return;
  const continuingOffer = kind === 'handReply' && reaction?.kind === 'offerHand';
  if (fromTap && kind !== 'welcome' && reaction?.next === 'welcome') return;
  if (kind === 'hipDodge' && reaction?.kind === 'hipDodge') return;
  if (reaction && reaction.elapsed < reaction.duration-.38 && fromTap && kind !== 'welcome' && !continuingOffer) {
    if (reaction.fromTap && !fromStroke && kind !== 'handReply' && kind !== 'hipDodge' && kind !== 'flinch') return;
    reaction.duration = Math.min(reaction.duration,reaction.elapsed+.38);
    reaction.next = kind;
    reaction.nextSide = touchSide;
    reaction.nextStroke = strokeContact;
    return;
  }
  const offset = camera.position.clone().sub(root.position).applyAxisAngle(turnAxis,-root.rotation.y);
  reaction = {...reactions[kind],kind,fromTap,elapsed:0,side:touchSide ?? (offset.x > .15 ? 'P' : 'N')};
  reaction.continuingOffer = continuingOffer;
  reaction.strokeContact = strokeContact;
  mood.offeredHand = kind === 'offerHand' ? {side:reaction.side,until:mood.seconds+reaction.duration} : null;
  if (kind === 'beckon') {
    const radius = camera.position.distanceTo(orbit.target);
    invitation = {
      expires: performance.now() + 1000*(reaction.duration+5),
      radius,
      camera: camera.position.clone(),
      threshold: T.MathUtils.clamp(radius*.067,.045,.12),
      closing: 0
    };
  }
  const status = $('reactionStatus');
  status.textContent = reaction.label;
  status.hidden = false;
}

function sampleReaction(clip, progress, mirror) {
  const [a,b,fraction] = sampleIndices(progress*(clip.length-1),clip.length,false);
  for (const [index,rotation] of clip[a].entries()) {
    const sample = gestureSample[index].copy(rotation).slerp(clip[b][index],fraction);
    if (mirror) sample.set(sample.x,-sample.y,-sample.z,sample.w);
  }
}

function applyCapturedArm(kind,side,weight) {
  const [upper,elbow,hand] = gestureSample;
  const fore = groups['fore'+side];
  const upperJoint = groups['upper'+side];
  root.getWorldQuaternion(reactionHeading);
  const softness = kind === 'smallWave' ? .81 : .96;
  gestureLocal.copy(upper).invert().multiply(elbow);
  groups['elbow'+side].quaternion.slerp(gestureLocal,weight*softness);
  gestureLocal.copy(elbow).invert().multiply(hand);
  groups['hand'+side].quaternion.slerp(gestureLocal,weight*softness);
  fore.quaternion.slerp(neutralRotation,weight*softness);
  if (kind === 'smallWave') {
    // Lower the shoulder and keep the hand roughly at shoulder height.
    const direction = side === 'P' ? -1 : 1;
    gestureAdjustment.setFromAxisAngle(gestureRoll,direction*.54);
    upper.premultiply(gestureAdjustment);
    gestureAdjustment.setFromAxisAngle(gestureRoll,-direction*.24);
    groups['elbow'+side].quaternion.premultiply(
      gestureLocal.copy(neutralRotation).slerp(gestureAdjustment,weight));
  }
  upperJoint.parent.getWorldQuaternion(gestureLocal).invert()
    .multiply(reactionHeading).multiply(upper);
  upperJoint.quaternion.slerp(gestureLocal,weight*softness);
}

// Fit the arm to a wrist target in front of the chest using both segment lengths.
function orientPalm(side,forward,normal) {
  palmAcross.crossVectors(forward,normal);
  return desiredHandRotation.setFromRotationMatrix(palmBasis.makeBasis(forward,normal,palmAcross))
    .multiply(palmRig[side].rest);
}

const heldElbowLocal = new T.Vector3();
const heldArmSample = new T.Vector3();
const heldArmEnd = new T.Vector3();
const heldBendAxis = new T.Vector3();
const heldBendOption = new T.Vector3();

function heldArmClear(elbow,shoulder,endpoint) {
  const joint = groups.chest.worldToLocal(heldElbowLocal.copy(elbow).add(shoulder));
  // The upper arm starts next to the chest. Allow its first part to exit the shoulder.
  for (const point of [joint,groups.chest.worldToLocal(heldArmSample.copy(shoulder).addScaledVector(elbow,.66))]) {
    if (point.y > -.174 && point.y < .045 && Math.abs(point.x) < .057 && point.z > -.055 && point.z < .087) return false;
  }
  for (const fraction of [.25,.5,.75,1]) {
    heldArmSample.copy(joint).lerp(endpoint,fraction);
    if (heldArmSample.y > -.196 && heldArmSample.y < .051 && Math.abs(heldArmSample.x) < .062 &&
        heldArmSample.z > -.051 && heldArmSample.z < .098) return false;
  }
  return true;
}

function keepHeldElbowClear(elbow,bend,shoulder,ray,along,length) {
  const endpoint = groups.chest.worldToLocal(heldArmEnd.copy(shoulder).addScaledVector(ray,length));
  if (heldArmClear(elbow,shoulder,endpoint)) return true;
  heldBendAxis.copy(bend).addScaledVector(ray,-along);
  for (const angle of [.42,-.42,.83,-.83,1.23,-1.23,1.62,-1.62,2.08,-2.08,Math.PI]) {
    heldBendOption.copy(heldBendAxis).applyAxisAngle(ray,angle).addScaledVector(ray,along);
    if (heldArmClear(heldBendOption,shoulder,endpoint)) {
      elbow.copy(heldBendOption);
      return true;
    }
  }
  return false;
}

function reachHand(side,target,orientation,weight,held=false) {
  const upper = groups['upper'+side], elbow = groups['elbow'+side];
  const upperRest = base['elbow'+side], lowerRest = base['hand'+side];
  const shoulder = upper.getWorldPosition(V(0,0,0));
  const ray = target.clone().sub(shoulder);
  const a = upperRest.length(), b = lowerRest.length();
  const length = T.MathUtils.clamp(ray.length(), Math.abs(a-b)+.001, a+b-.001);
  ray.normalize();
  // A held elbow follows an outward, slightly forward arc around the armor.
  const sign = side === 'P' ? 1 : -1;
  const bend = groups.chest.localToWorld(handBend.set(sign*(held ? .037 : .14),held ? -.25 : -.15,held ? .075 : 0))
    .sub(groups.chest.getWorldPosition(V(0,0,0)));
  bend.addScaledVector(ray,-bend.dot(ray)).normalize();
  const along = (a*a-b*b+length*length)/(2*length);
  const upperDirection = bend.multiplyScalar(Math.sqrt(Math.max(0,a*a-along*along))).addScaledVector(ray,along);
  const upperPose = upper.quaternion.clone(), elbowPose = elbow.quaternion.clone();
  if (held && !keepHeldElbowClear(upperDirection,bend,shoulder,ray,along,length)) return false;
  aim(upper,upperRest,upperDirection);
  aim(elbow,lowerRest,ray.multiplyScalar(length).sub(upperDirection));
  upper.quaternion.slerp(upperPose,1-weight);
  elbow.quaternion.slerp(elbowPose,1-weight);
  groups['fore'+side].quaternion.slerp(neutralRotation,weight);
  const hand = groups['hand'+side];
  hand.parent.getWorldQuaternion(gestureLocal).invert().multiply(orientation);
  hand.quaternion.slerp(gestureLocal,weight);
  return true;
}

function applyHipDodge(direction,weight) {
  for (const {joint,pose} of hipReactionJoints) pose.copy(joint.quaternion);
  hipPosition.copy(groups.pelvis.position);
  hipReactionApplied = true;
  groups.chest.rotateZ(-direction*.23*weight);
  groups.abdomen.rotateY(direction*.18*weight);
  if (moodSituation() === 'focused' || mode === 'roam' && roam.phase === 'seated') return;
  groups.footP.getWorldPosition(hipFeet[0]);
  groups.footN.getWorldPosition(hipFeet[1]);
  groups.pelvis.position.x += direction*.086*weight;
  groups.pelvis.position.z -= .055*weight;
  groups.pelvis.position.y -= .035*weight;
  groups.pelvis.rotateY(direction*.22*weight);
  solveLeg('P',hipFeet[0],root.rotation.y);
  solveLeg('N',hipFeet[1],root.rotation.y);
  // Fade the orientation back to the underlying pose at both ends.
  for (const {key,joint,pose} of hipReactionJoints) {
    if (/^(foot|shin)/.test(key)) joint.quaternion.slerp(pose,1-weight);
  }
}

function applyTouchPose(pose,side,yaw,pitch,time,weight) {
  const direction = side === 'P' ? -1 : 1;
  const head = groups.head;
  groups.neck.rotateY(.15*yaw*weight);
  head.rotateY(.52*yaw*weight);
  head.rotateX(.55*pitch*weight);
  if (pose === 'tilt' || pose === 'lean') {
    const lean = pose === 'lean' ? 1 : .45;
    groups.neck.rotateZ(direction*.12*lean*weight);
    head.rotateZ(direction*.25*lean*weight);
    head.rotateX((reaction.kind === 'lingerLean' && time > 1.15 ? -.10 : .07)*weight);
  } else if (pose === 'dodge' || pose === 'withdraw' || pose === 'flinch') {
    const recoil = pose === 'dodge' ? Math.cos(Math.PI*Math.min(1,time/.72)) : 1;
    groups.chest.rotateZ(-direction*.14*recoil*weight);
    groups.neck.rotateX(-.12*recoil*weight);
    head.rotateZ(-direction*.21*recoil*weight);
    if (pose === 'flinch') groups['upper'+side].rotateZ(direction*.22*weight);
  } else if (pose === 'hipDodge') {
    applyHipDodge(direction,weight);
  } else if (pose === 'hand') {
    const offerWeight = reaction.continuingOffer
      ? smooth(Math.min(1,(reaction.duration-time)/.35)) : weight;
    groups.chest.worldToLocal(handView.copy(camera.position));
    const handYaw = T.MathUtils.clamp(Math.atan2(handView.x,handView.z),-.79,.79);
    const handHeight = -.087+T.MathUtils.clamp(
      .05*handView.y/Math.max(.25,Math.hypot(handView.x,handView.z)),-.035,.047);
    const x = -direction*.038+.145*Math.sin(handYaw);
    const z = .162*Math.cos(handYaw);
    const wristTarget = groups.chest.localToWorld(handTarget.set(x,handHeight,z));
    palmForward.copy(camera.position).sub(wristTarget);
    palmForward.y = 0;
    if (palmForward.lengthSq() < .00001) {
      palmForward.set(Math.sin(root.rotation.y),0,Math.cos(root.rotation.y));
    }
    palmForward.normalize();
    reachHand(side,wristTarget,orientPalm(side,palmForward,palmUp),offerWeight);
    if (reaction.kind === 'handReply') {
      const otherSide = side === 'P' ? 'N' : 'P';
      const approach = smooth(Math.min(1,time/.44));
      const lower = smooth(T.MathUtils.clamp((time-.44)/.39,0,1));
      // Track the actual offered palm after applying the arm and wrist pose.
      groups['hand'+side].localToWorld(offeredPalm.copy(palmRig[side].center));
      coverPalm.copy(offeredPalm);
      coverPalm.y += mix(.073,.003,lower);
      const coverRotation = orientPalm(otherSide,palmForward,palmDown);
      coverWrist.copy(coverPalm).sub(handBend.copy(palmRig[otherSide].center).applyQuaternion(coverRotation));
      const coverWeight = approach*smooth(Math.min(1,(reaction.duration-time)/.35));
      reachHand(otherSide,coverWrist,coverRotation,coverWeight);
    }
    head.rotateZ(direction*.08*offerWeight);
  }
}

function rearRamp(time,start,end) {
  return smooth(T.MathUtils.clamp((time-start)/(end-start),0,1));
}

function startRearFootwork(entry, side) {
  const standing = mode === 'standWait' || mode === 'roam' && ['wait','linger','window','rest'].includes(roam.phase);
  if (!standing || !entry.step && !entry.turn) return null;
  const from = root.position.clone();
  const angle = root.rotation.y;
  const sign = side === 'P' ? 1 : -1;
  const delta = V(-sign*.045,0,entry.step ?? 0).applyAxisAngle(turnAxis,angle);
  const to = from.clone().add(delta);
  const couch = new T.Box3(sofaTarget.lookAt.clone().add(V(-.58,-2,-.80)),
    sofaTarget.lookAt.clone().add(V(.58,2,.80)));
  if (!entry.step || to.x < -5.65 || to.x > 5.65 || to.z < -5.65 || to.z > 8.65 ||
      !clearOfPoles(from,to) || couch.containsPoint(to) || couch.containsPoint(from)) delta.set(0,0,0);
  const turn = entry.turn && !couch.containsPoint(from)
    ? Math.abs(headingDelta(angle,headingTo(to,camera.position)))*sign : 0;
  if (!turn && delta.lengthSq() === 0) return null;
  const feet = [side,side === 'P' ? 'N' : 'P'].map(key => ({
    key,position:groups['foot'+key].getWorldPosition(V(0,0,0))
  }));
  return {mode,from,angle,delta,turn,feet};
}

function advanceRearFootwork(entry,time) {
  if (time < .42) return 0;
  if (entry.rearFeet === undefined) entry.rearFeet = startRearFootwork(entry,entry.side);
  const legs = entry.rearFeet;
  if (!legs || legs.mode !== mode) return 0;
  const stepEnd = entry.returnStep ? 2.33 : 1.27;
  const shift = rearRamp(time,.49,1.2)*(entry.returnStep ? 1-rearRamp(time,1.65,stepEnd) : 1);
  const turnStart = entry.step ? 1.14 : .35;
  const rotation = legs.turn*rearRamp(time,turnStart,turnStart+.92);
  const position = legs.from.clone().addScaledVector(legs.delta,shift);
  setTravelPosition(position.x,position.z,true);
  root.rotation.y = legs.angle+rotation;
  const blend = rearRamp(time,.42,.55)*(1-rearRamp(time,entry.duration-.49,entry.duration-.22));
  if (blend <= 0) return rotation;
  for (const {joint,pose} of hipReactionJoints) pose.copy(joint.quaternion);
  hipPosition.copy(groups.pelvis.position);
  hipReactionApplied = true;
  for (const [index,{key,position:foot}] of legs.feet.entries()) {
    const lag = index*.22;
    const out = rearRamp(time,.43+lag,.94+lag);
    const back = entry.returnStep ? rearRamp(time,1.62+lag,2.1+lag) : 0;
    const footTurn = legs.turn*rearRamp(time,turnStart+lag,turnStart+.67+lag);
    const target = foot.clone().sub(legs.from).applyAxisAngle(turnAxis,footTurn)
      .add(legs.from).addScaledVector(legs.delta,out-back);
    target.y += (legs.delta.lengthSq() > .0001 ? .027 : 0)*(Math.sin(Math.PI*out)+Math.sin(Math.PI*back));
    if (legs.turn) target.y += .021*Math.sin(Math.PI*rearRamp(time,turnStart+lag,turnStart+.67+lag));
    solveLeg(key,target,legs.angle+footTurn);
  }
  for (const {key,joint,pose} of hipReactionJoints) {
    if (/^(thigh|knee|foot|shin)/.test(key)) joint.quaternion.slerp(pose,1-blend);
  }
  return rotation;
}

function applyReceptiveLean(entry,time,sign) {
  const standing = mode === 'standWait' || mode === 'roam' && ['wait','linger','window','rest'].includes(roam.phase);
  if (!standing) return;
  const amount = rearRamp(time,.74,1.38)*(1-rearRamp(time,entry.duration-.72,entry.duration-.24));
  if (amount <= 0) return;

  const pelvis = groups.pelvis;
  for (const {joint,pose} of hipReactionJoints) pose.copy(joint.quaternion);
  hipPosition.copy(pelvis.position);
  hipReactionApplied = true;
  groups.footP.getWorldPosition(hipFeet[0]);
  groups.footN.getWorldPosition(hipFeet[1]);

  const arch = rearRamp(time,.87,1.51)*(1-rearRamp(time,entry.duration-.72,entry.duration-.24));
  pelvis.position.x += sign*.010*amount;
  pelvis.position.y -= .014*amount;
  pelvis.position.z -= entry.leanBack*.72*amount;
  pelvis.rotateY(sign*.07*amount);
  // Lead from the pelvis, then extend the spine while keeping the gaze level.
  pelvis.rotateX(.23*amount);
  groups.abdomen.rotateX(-.26*arch);
  groups.chest.rotateX(-.12*arch);
  groups.neck.rotateX(.11*arch);
  solveLeg('P',hipFeet[0],root.rotation.y);
  solveLeg('N',hipFeet[1],root.rotation.y);

  // Blend in the adjustment at the start and restore the underlying stance at the end.
  const legBlend = Math.min(1,amount*4);
  for (const {key,joint,pose} of hipReactionJoints) {
    if (/^(thigh|knee|shin|foot)/.test(key)) joint.quaternion.slerp(pose,1-legBlend);
  }
}

function applyRearReaction(entry,time,weight,pitch) {
  const sign = (entry.side === 'P' ? 1 : -1)*(entry.kind === 'rearOpposite' ? -1 : 1);
  const turned = advanceRearFootwork(entry,time);
  const gaze = weight*rearRamp(time,entry.delay ?? .10,(entry.delay ?? .10)+.43);
  const turn = entry.look*gaze*(1-.72*Math.min(1,Math.abs(turned)/1.7));
  const shock = entry.startle ? rearRamp(time,0,.095)*(1-rearRamp(time,.12,.36)) : 0;
  const relax = entry.relax ?? 0;
  const lean = entry.lean ?? 0;
  const spine = groups.chest, neck = groups.neck, head = groups.head;
  if (entry.hip && !hipReactionApplied && moodSituation() !== 'focused') {
    for (const {joint,pose} of hipReactionJoints) pose.copy(joint.quaternion);
    hipPosition.copy(groups.pelvis.position);
    hipReactionApplied = true;
    const sway = entry.hip*gaze*(entry.returnHip ? 1-rearRamp(time,1.38,2.02) : 1);
    groups.abdomen.rotateZ(sign*.31*sway);
    groups.abdomen.rotateY(-sign*.16*sway);
  }
  if (shock && moodSituation() !== 'focused' && !hipReactionApplied) {
    for (const {joint,pose} of hipReactionJoints) pose.copy(joint.quaternion);
    hipPosition.copy(groups.pelvis.position);
    hipReactionApplied = true;
  }
  if (shock && hipReactionApplied) groups.pelvis.rotateZ(-sign*.075*shock);
  if (entry.leanBack) applyReceptiveLean(entry,time,sign);
  spine.rotateY(sign*.42*turn);
  neck.rotateY(sign*.39*turn);
  head.rotateY(sign*.88*turn);
  spine.rotateX(-shock*.22-(entry.lift ?? 0)*weight*(1-rearRamp(time,.54,1.35))+lean*weight*.53);
  neck.rotateX(shock*.14+(entry.tuck ?? 0)*weight*(1-rearRamp(time,.48,1.1))+lean*.5*weight);
  head.rotateX(pitch*.46*gaze+(entry.down ?? 0)*gaze);
  head.rotateZ(-sign*(entry.tilt ?? 0)*gaze);

  const stroke = contact && contact === entry.strokeContact;
  const shoulder = stroke && /^shoulder[PN]$/.test(contact.path.at(-1).id) ? contact.path.at(-1).id.at(-1) : null;
  const rise = stroke && contact.path.some(part => part.id === 'backHead' || part.id === 'crown');
  entry.shoulderBlend = mix(entry.shoulderBlend ?? 0,shoulder ? 1 : 0,.15);
  if (shoulder) entry.strokeShoulder = shoulder;
  if (rise && entry.kind === 'rearBackRelax') head.rotateX(-.13*gaze);
  for (const side of ['P','N']) {
    const direction = side === 'P' ? 1 : -1;
    const extraRelax = entry.strokeShoulder === side ? entry.shoulderBlend*.25 : 0;
    groups['upper'+side].rotateZ(direction*(shock*.20-(relax*.15+extraRelax)*weight));
  }
  if (entry.guard) {
    const hand = entry.side;
    const local = handTarget.set(sign*.085,-.124,-.100);
    const target = groups.chest.localToWorld(local);
    const forward = V(-sign*.55,0,-.835).normalize().applyAxisAngle(turnAxis,root.rotation.y);
    reachHand(hand,target,orientPalm(hand,forward,palmDown),gaze*.93);
  }
}

const touchedArmPoint = new T.Vector3();
const touchedArmDirection = new T.Vector3();
const touchedArmOrientation = new T.Quaternion();

function applyArmReaction(entry,time,weight,yaw,pitch) {
  const side = entry.side;
  const hand = groups['hand'+side];
  const head = groups.head;
  hand.getWorldPosition(touchedArmPoint);
  touchedArmDirection.copy(touchedArmPoint).sub(head.getWorldPosition(jokeHeadPosition))
    .applyQuaternion(head.getWorldQuaternion(headWorld).invert());
  const armYaw = T.MathUtils.clamp(Math.atan2(touchedArmDirection.x,touchedArmDirection.z),-.67,.67);
  const armPitch = T.MathUtils.clamp(-Math.atan2(touchedArmDirection.y,Math.hypot(touchedArmDirection.x,touchedArmDirection.z)),0,.51);
  const lookBack = entry.offer || entry.returnArm ? rearRamp(time,.54,1.02) : rearRamp(time,.91,1.30)*.53;
  const look = weight*entry.look;
  groups.neck.rotateY(.30*mix(armYaw,yaw,lookBack)*look);
  head.rotateY(.70*mix(armYaw,yaw,lookBack)*look);
  head.rotateX(mix(armPitch,pitch,lookBack)*look);

  if (!entry.lift && !entry.withdraw || moodSituation() === 'focused') return;
  const turn = entry.returnArm ? 1-rearRamp(time,.65,1.33) : 1;
  if (entry.returnArm) {
    const sign = side === 'P' ? 1 : -1;
    const twist = sign*turn*weight;
    groups.chest.rotateY(.36*twist);
    groups.chest.rotateZ(-.10*twist);
    groups.neck.rotateY(-.14*twist);
  }
  const lift = (entry.lift ?? 0)+(entry.withdraw ? .031*turn : 0);
  groups.chest.worldToLocal(touchedArmPoint);
  touchedArmPoint.y += lift;
  touchedArmPoint.z += (entry.reach ?? 0)-(entry.withdraw ?? 0)*turn;
  touchedArmPoint.x *= entry.withdraw ? 1-.25*turn : 1;
  groups.chest.localToWorld(touchedArmPoint);
  hand.getWorldQuaternion(touchedArmOrientation);
  reachHand(side,touchedArmPoint,touchedArmOrientation,weight*.87);
}

function applyReaction(dt) {
  if (!reaction) return;
  const {kind,duration,side,clip} = reaction;
  const time = reaction.elapsed += dt;
  if (time >= duration) {
    const {next,nextSide,nextStroke,pose,offer,side:offeredSide} = reaction;
    if (pose === 'rear' || pose === 'arm' || reaction.touchFollowUp) touchPause.until = mood.seconds+.75;
    reaction = null;
    if (offer) {
      beginReaction('offerHand',false,offeredSide);
      reaction.touchFollowUp = true;
    }
    else if (next) beginReaction(next,true,nextSide,Boolean(nextStroke),nextStroke);
    else $('reactionStatus').hidden = true;
    return;
  }
  const weight = smooth(Math.min(1,time/.22,(duration-time)/.35));
  for (const {joint,pose} of reactionJoints) pose.copy(joint.quaternion);
  reactionApplied = true;

  const head = groups.head;
  gazeDirection.copy(camera.position).sub(head.getWorldPosition(jokeHeadPosition));
  gazeDirection.applyQuaternion(head.getWorldQuaternion(headWorld).invert());
  const yaw = T.MathUtils.clamp(Math.atan2(gazeDirection.x,gazeDirection.z),-1.38,1.38);
  const pitch = T.MathUtils.clamp(-Math.atan2(gazeDirection.y,Math.hypot(gazeDirection.x,gazeDirection.z)),-.25,.25);
  if (reaction.pose === 'arm') {
    applyArmReaction(reaction,time,weight,yaw,pitch);
    return;
  }
  if (reaction.pose === 'rear') {
    applyRearReaction(reaction,time,weight,pitch);
    return;
  }
  if (reaction.pose) {
    applyTouchPose(reaction.pose,side,yaw,pitch,time,weight);
    return;
  }
  // Use the authored clip timing even if a tap shortens the fade-out.
  sampleReaction(gestureClips[clip],time/reactions[kind].duration,side === 'P' && clip !== 'nod' && clip !== 'look');
  let turn = yaw, chin = pitch, tilt = 0;
  if (clip === 'look') {
    gestureEuler.setFromQuaternion(gestureSample[0],'YXZ');
    const shoulder = T.MathUtils.clamp(Math.abs(gestureEuler.y)/1.28,0,1);
    gestureEuler.setFromQuaternion(gestureSample[1],'YXZ');
    const glance = T.MathUtils.clamp(Math.abs(gestureEuler.y)/2.28,0,1);
    groups.chest.rotateY(.24*yaw*shoulder*weight);
    turn = yaw*(.75*glance+.10);
    chin = pitch*glance + .045*glance;
    tilt = Math.sign(yaw)*.075*glance;
  } else if (clip === 'nod') {
    gestureEuler.setFromQuaternion(gestureSample[0],'YXZ');
    groups.neck.rotateX(-.48*gestureEuler.x*weight);
    gestureEuler.setFromQuaternion(gestureSample[1],'YXZ');
    chin -= .88*gestureEuler.x;
    tilt = .42*gestureEuler.z;
    if (kind === 'welcome') {
      chin += .045;
      tilt += (side === 'P' ? -1 : 1)*.085;
    }
  } else {
    const greeting = smooth(Math.min(1,time/.46,(duration-time)/.55));
    tilt = (side === 'P' ? -1 : 1)*.10*greeting;
    chin += .038*greeting;
  }
  groups.neck.rotateY(.23*turn*weight);
  head.rotateY(.77*turn*weight);
  head.rotateX(chin*weight);
  head.rotateZ(tilt*weight);
  if (clip === 'greeting' || clip === 'beckon') applyCapturedArm(kind,side,weight);
}

for (const kind of ['smallWave','largeWave','beckon','nod','look']) {
  $(kind+'Preview').onclick = () => beginReaction(kind);
}

// Button and slider handlers can capture the current base pose between frames.
document.querySelector('section').addEventListener('click',restoreReactionPose,true);
document.querySelector('section').addEventListener('input',restoreReactionPose,true);

function beginAttention(spontaneous = false) {
  const head = groups.head;
  gazeDirection.copy(camera.position).sub(head.getWorldPosition(new T.Vector3()));
  gazeDirection.applyQuaternion(head.getWorldQuaternion(headWorld).invert());
  roam.attention = {
    elapsed: 0,
    blend: 0,
    duration: spontaneous ? .95 : 2,
    yaw: T.MathUtils.clamp(Math.atan2(gazeDirection.x,gazeDirection.z),-1.48,1.48),
    pitch: T.MathUtils.clamp(-Math.atan2(gazeDirection.y,Math.hypot(gazeDirection.x,gazeDirection.z)),-.22,.22)
    // The idle pose is evaluated each frame underneath this gaze.
  };
  $('destination').textContent = spontaneous ? 'ふとこちらを見ています' : 'こちらを見ています';
}

function applyRestPose() {
  const idle = roam.idle;
  const clip = idle.clip;
  const blend = smooth(Math.min(1,roam.elapsed/.65));
  const [first,next,fraction] = sampleIndices((idle.offset + roam.elapsed)*clip.fps,clip.hips.length,false);
  const pelvis = groups.pelvis;
  walkOffset.copy(clip.hips[first]).lerp(clip.hips[next],fraction).sub(idle.center);
  walkOffset.y += idle.center.y - .998701;
  pelvis.position.copy(idle.pelvis).lerp(
    transitionHip.copy(base.pelvis).addScaledVector(walkOffset,transferScale),blend);
  pelvis.position.y -= .019 * blend;

  // Convert the captured model-space rotations to local ones before blending.
  root.rotation.y = 0;
  for (const [index,key] of capturedWalk.joints.entries()) {
    groups[key].quaternion.copy(clip.rotations[first][index]).slerp(clip.rotations[next][index],fraction);
  }
  for (let index=capturedWalk.joints.length-1;index>=0;index--) {
    const key = capturedWalk.joints[index];
    let parent = defs[key][0];
    while (parent && !idle.rotations[parent]) parent = defs[parent][0];
    const joint = groups[key];
    if (parent) joint.quaternion.premultiply(walkParent.copy(groups[parent].quaternion).invert());
    joint.quaternion.slerp(idle.rotations[key],1-blend);
  }
  root.rotation.y = roam.heading;
  lowerSupportingHeels(blend);
  alignSupportToFloor(1,true);

  if (idle.joke) {
    applyJokePose(idle.joke,roam.elapsed-idle.jokeStart);
    return;
  }

  // Two gentle looks with a return to center, independent of the camera.
  if (idle.scan) {
    const time = roam.elapsed - idle.scanStart;
    const firstLook = Math.sin(Math.PI * T.MathUtils.clamp(time/1.35,0,1)) ** 2;
    const secondLook = Math.sin(Math.PI * T.MathUtils.clamp((time-1.22)/1.35,0,1)) ** 2;
    const yaw = idle.scan * (.36*firstLook - .29*secondLook);
    groups.neck.rotateY(.28*yaw);
    groups.head.rotateY(.72*yaw);
    groups.head.rotateX(-.055*firstLook + .038*secondLook);
  }
}

function localClip(source) {
  const clip = prepareTransition(source);
  const indexByJoint = new Map(source.joints.map((key,index)=>[key,index]));
  const parentIndices = source.joints.map(key => {
    let parent = defs[key][0];
    while (parent && !indexByJoint.has(parent)) parent = defs[parent][0];
    return indexByJoint.get(parent);
  });
  clip.rotations = clip.rotations.map(row=>row.map((q,index)=>{
    const parent = parentIndices[index];
    return parent === undefined ? q : row[parent].clone().invert().multiply(q);
  }));
  return clip;
}
const gestureRotation = new T.Quaternion();
const turnAxis = new T.Vector3(0,1,0);
const jokeHeadPosition = new T.Vector3();

function blendGesture(clip, time, weight, upperOnly = false) {
  const [first,next,fraction] = sampleIndices(time*clip.fps,clip.hips.length,false);
  for (const [index,key] of capturedWalk.joints.entries()) {
    if (upperOnly && /^(pelvis|thigh|knee|foot)/.test(key)) continue;
    gestureRotation.copy(clip.rotations[first][index]).slerp(clip.rotations[next][index],fraction);
    groups[key].quaternion.slerp(gestureRotation,weight);
  }
  return [first,next,fraction];
}
function applyJokePose(joke,time) {
  if (time <= 0 || time >= jokeDuration) return;
  const pose = smooth(T.MathUtils.clamp(Math.min(time/.33,(jokeReactionStart-time)/.38),0,1));
  blendGesture(joke.pose,0,pose);
  const hipRaise = (joke.pose.hips[0].y - 1.034) * transferScale;
  groups.pelvis.position.y += hipRaise * pose;

  const elapsed = time - jokeReactionStart;
  const reaction = smooth(T.MathUtils.clamp(Math.min(elapsed/.25,(jokeDuration-time)/.35),0,1));
  if (!reaction) return;
  if (joke.reaction === 'stare') {
    const head = groups.head;
    gazeDirection.copy(camera.position).sub(head.getWorldPosition(jokeHeadPosition));
    gazeDirection.applyQuaternion(head.getWorldQuaternion(headWorld).invert());
    const yaw = T.MathUtils.clamp(Math.atan2(gazeDirection.x,gazeDirection.z),-1.48,1.48);
    groups.neck.rotateY(.22*yaw*reaction);
    head.rotateY(.78*yaw*reaction);
    head.rotateX(T.MathUtils.clamp(-Math.atan2(gazeDirection.y,Math.hypot(gazeDirection.x,gazeDirection.z)),-.22,.22)*reaction);
  } else {
    const clip = joke.reaction === 'shy' ? shyClip : downClip;
    const reactionTime = T.MathUtils.clamp(elapsed/1.30,0,1);
    // Hold the expressive part of each clip until the reaction fades.
    blendGesture(clip,reactionTime*clip.duration*.78,reaction,true);
  }
}

function advanceRoam(dt) {
  if (roam.phase === 'route') {
    advanceDestinationRoute(dt);
    return;
  }
  if (roam.attention) {
    const gaze = roam.attention;
    gaze.elapsed += dt;
    gaze.blend = T.MathUtils.clamp(Math.min(gaze.elapsed/.28,(gaze.duration-gaze.elapsed)/.34),0,1);
    const weight = smooth(gaze.blend);
    if (roam.phase === 'wait') blendSofaPose(roam.waitPose,1);
    else if (roam.phase === 'rest') applyRestPose();
    else applyQuietPose();
    groups.neck.rotateY(gaze.yaw * .22 * weight);
    groups.head.rotateY(gaze.yaw * .78 * weight);
    groups.head.rotateX(gaze.pitch * weight);
    if (gaze.elapsed >= gaze.duration) {
      roam.attention = null;
      $('destination').textContent = roam.phase === 'wait'
        ? '自律行動中・待機中'
        : roam.quietMessage ?? (roam.target.name + 'に到着・休憩中');
    }
    return;
  }
  const lingeringReaction = reaction?.pose === 'rear' || reaction?.pose === 'arm'
    || reaction?.touchFollowUp
    || mood.seconds < touchPause.until;
  if (!lingeringReaction) roam.elapsed += dt;
  if (roam.phase === 'rest') {
    applyRestPose();
    if (!lingeringReaction && roam.elapsed >= roam.glanceAt) {
      roam.glanceAt = Infinity;
      beginAttention(true);
      return;
    }
  } else if (roam.phase === 'seated') {
    sitAtSofa(1,roam.elapsed);
  } else if (roam.phase === 'window' || roam.phase === 'linger') {
    applyQuietPose();
  }
  if (roam.handRelease) {
    const release = roam.handRelease;
    release.time += dt;
    const settle = rearRamp(release.time,0,.40);
    blendSofaPose(release.pose,1-settle);
    if (settle >= 1) roam.handRelease = null;
  }
  if (!lingeringReaction && roam.elapsed >= roam.pause) {
    if (!reaction && mood.seconds >= mood.avoidedUntil && mood.seconds >= mood.followUpAt) {
      mood.followUpAt = Infinity;
      roam.pause = roam.elapsed+5;
      beginReaction('offerHand');
      return;
    }
    const danceChance = currentMood() === 'bored' ? .52 : currentMood() === 'affectionate' ? .10 : .26;
    if ((roam.phase==='wait' || roam.phase==='linger') && canDanceHere() && Math.random()<danceChance) {
      beginDance('auto');
      return;
    }
    chooseDestination();
  }
}

function chooseDestination() {
  const roll = Math.random();
  const feeling = currentMood();
  const social = !reaction && moodSituation() === 'free' && mood.seconds >= Math.max(mood.nextSocialAt,mood.avoidedUntil);
  const approachChance = feeling === 'affectionate' ? .42 : feeling === 'annoyed' ? .04 : .16;
  const greetingChance = feeling === 'annoyed' ? .04 : feeling === 'happy' ? .23 : .11;
  if (social && roam.target?.kind !== 'user' && roll < approachChance) {
    const target = userApproachTarget();
    if (target) {
      mood.nextSocialAt = mood.seconds+25;
      startDestination(target);
      return;
    }
  }
  if (social && roll < approachChance+greetingChance) {
    mood.nextSocialAt = mood.seconds+25;
    const point = camera.position.clone();
    const heading = headingTo(root.position,point);
    const gesture = weightedChoice(feeling === 'affectionate' || feeling === 'bored'
      ? [['beckon',5],['offerHand',2]]
      : feeling === 'playful' ? [['look',4],['beckon',1]]
      : [['smallWave',4],['largeWave',2],['beckon',1]]);
    startDestination({kind:'greeting',name:'ユーザー',heading,gesture});
    return;
  }
  if (roll < .32) {
    startDestination(wanderingTarget());
  } else if (roll < .58 && roam.phase !== 'window') {
    startDestination(randomWindow());
  } else if (roll < .75 && roam.phase !== 'linger' && roam.phase !== 'seated') {
    startDestination(lingeringTarget());
  } else {
    const choices = walkTargets.filter(target => target !== roam.target);
    startDestination(choices[Math.floor(Math.random()*choices.length)]);
  }
}

$('autoWalk').onclick = () => {
  if (mode !== 'roam') beginRoam();
  const choices = walkTargets.filter(target => target !== roam.target);
  requestDestination(choices[Math.floor(Math.random()*choices.length)]);
};
$('autoWait').onclick = () => {
  if (mode==='dance') beginDanceOutro();
  else if (mode!=='roam') beginRoam();
};
const travelJoint = new T.Quaternion();
const transitionJoint = new T.Quaternion();
const transitionHip = new T.Vector3();
function prepareTransition(source) {
  const align = Object.fromEntries(Object.entries(source.align).map(([key, vector]) => {
    const original = new T.Vector3(...capturedWalk.align[key]);
    const correction = new T.Quaternion().setFromUnitVectors(original, new T.Vector3(...vector));
    return [key, correction.multiply(restCorrection[key])];
  }));
  return {
    fps: source.fps,
    duration: (source.frames.length - 1) / source.fps,
    rotations: source.frames.map(frame => frame.rot.map((values, index) => {
      const rotation = new T.Quaternion(...values).normalize();
      const correction = align[source.joints[index]];
      return correction ? rotation.multiply(correction) : rotation;
    })),
    hips: source.frames.map(frame => new T.Vector3(...frame.hip))
  };
}
function sampleIndices(frame, count, loop) {
  const position = loop ? (frame % count + count) % count : T.MathUtils.clamp(frame, 0, count - 1);
  const first = Math.floor(position);
  return [first, (first + 1) % count, position - first];
}
function resetTravel() {
  root.rotation.y = 0;
  setTravelPosition(0, 0);
}
function setTravelDistance(distance) {
  setTravelPosition(root.position.x, distance);
}
function setTravelPosition(x, z, holdCamera=false) {
  if (followLeila && !holdCamera) {
    camera.position.x += x - root.position.x;
    camera.position.z += z - root.position.z;
    orbit.target.x += x - root.position.x;
    orbit.target.z += z - root.position.z;
  }
  root.position.set(x,0,z);
}
function travelPose(elapsed, routeDuration = cruiseDuration, origin = 0, heading = 0, direct = false, speed = cruiseSpeed, phaseOffset = 0, planarRoute = null) {
  root.rotation.y = 0; // Retarget in the rig's forward direction before turning the whole rig.

  const stopStart = startEnd + routeDuration;
  const stopping = elapsed >= stopStart;
  const clip = stopping ? clipStop : clipStart;
  const clipTime = stopping ? elapsed - stopStart : elapsed;
  const walkTime = elapsed - startEnd + (direct ? 0 : enterPhase) + phaseOffset;
  const [a,b,u] = sampleIndices(clipTime * clip.fps, clip.hips.length, false);
  const [i,j,v] = sampleIndices(walkTime * capturedWalk.fps, walkHips.length, true);
  const clipWeight = stopping
    ? smooth(Math.min(1, clipTime / blendDuration))
    : 1 - smooth(T.MathUtils.clamp((elapsed - startEnd + blendDuration) / blendDuration, 0, 1));
  transitionHip.copy(clip.hips[a]).lerp(clip.hips[b],u);
  const leadDistance = direct ? 0 : startDistance;
  const distance = stopping
    ? leadDistance + speed * routeDuration + transitionHip.z - clipStop.hips[0].z
    : elapsed < startEnd ? transitionHip.z - clipStart.hips[0].z
      : leadDistance + speed * (elapsed - startEnd);
  const metres = distance * transferScale;
  if (planarRoute) {
    const {from,scale} = planarRoute;
    setTravelPosition(from.x + Math.sin(heading)*metres*scale, from.z + Math.cos(heading)*metres*scale,planarRoute.holdCamera);
  } else {
    setTravelDistance(origin + (heading === Math.PI ? -1 : 1) * metres);
  }

  for (const key in groups) {
    groups[key].position.copy(base[key]);
    groups[key].quaternion.identity();
  }
  walkOffset.copy(walkHips[i]).lerp(walkHips[j],v).sub(hipCenter);
  walkOffset.z *= 1 - clipWeight;
  walkOffset.x *= 1 - clipWeight;
  walkOffset.x += (transitionHip.x - hipCenter.x) * clipWeight;
  walkOffset.y = T.MathUtils.lerp(walkOffset.y, transitionHip.y - hipCenter.y,clipWeight);
  groups.pelvis.position.addScaledVector(walkOffset,transferScale);
  groups.pelvis.position.y += T.MathUtils.lerp(.021, stopping ? .020 : .021, clipWeight);
  for (const [index,key] of capturedWalk.joints.entries()) {
    const joint = groups[key];
    travelJoint.copy(walkQuats[i][index]).slerp(walkQuats[j][index],v);
    if (restCorrection[key]) travelJoint.multiply(restCorrection[key]);
    transitionJoint.copy(clip.rotations[a][index]).slerp(clip.rotations[b][index],u);
    travelJoint.slerp(transitionJoint,clipWeight);
    joint.parent.getWorldQuaternion(walkParent).invert();
    joint.quaternion.copy(walkParent.multiply(travelJoint));
  }
  root.rotation.y = heading;
  easeCatwalkToePitch(walkTime,1-clipWeight);
  if (elapsed > 0) lowerSupportingHeels(clipWeight);
}

function easeCatwalkToePitch(time,walkWeight=1) {
  if (walkWeight <= 0) return;
  // Translate the captured pose without changing any leg joint angles.
  groups.pelvis.position.y -= .052*smooth(walkWeight);
  for (const [index,{foot,vertices}] of shoeContactGeometry.entries()) {
    const cycle = time/walkCycle - 1/6 - index*.5;
    let phase = cycle - Math.floor(cycle);
    if (phase > .9) phase -= 1;
    if (phase < -.1 || phase > .65) continue;
    const weight = smooth(T.MathUtils.clamp((phase+.1)/.1,0,1))
      * (1-smooth(T.MathUtils.clamp((phase-.43)/.22,0,1))) * walkWeight;
    if (weight <= 0) continue;

    const ankleY = foot.getWorldPosition(V(0,0,0)).y;
    const rotation = foot.getWorldQuaternion(new T.Quaternion());
    const ankle = new T.Euler().setFromQuaternion(rotation,'YXZ');
    const sourcePitch = ankle.x;
    // Lower the heel at full reach, then roll forward to the available sole contact.
    const heelPitch = -.42;
    const roll = smooth(T.MathUtils.clamp((phase-.025)/.22,0,1));
    const solePitch = roll > 0 ? catwalkSolePitch(vertices,ankle,ankleY) : heelPitch;
    const push = smooth(T.MathUtils.clamp((phase-.31)/.24,0,1));
    const targetPitch = mix(mix(heelPitch,solePitch,roll),Math.max(solePitch,.23),push);
    ankle.x = mix(sourcePitch,targetPitch,weight);
    const parent = foot.parent.getWorldQuaternion(new T.Quaternion()).invert();
    foot.quaternion.copy(parent.multiply(rotation.setFromEuler(ankle)));
  }
}

function catwalkSolePitch(vertices,ankle,ankleY) {
  const trial = ankle.clone();
  const rotation = new T.Quaternion();
  const matrix = new T.Matrix4();
  let low = 0, high = .85;
  for (let step=0; step<9; step++) {
    trial.x = (low+high)/2;
    const m = matrix.makeRotationFromQuaternion(rotation.setFromEuler(trial)).elements;
    let bottom = Infinity;
    for (let i=0; i<vertices.length; i+=3) {
      const y = m[1]*vertices[i]+m[5]*vertices[i+1]+m[9]*vertices[i+2];
      if (y < bottom) bottom = y;
    }
    if (ankleY+bottom > 0) low = trial.x;
    else high = trial.x;
  }
  return (low+high)/2;
}

const sofaDock = V(0,0,0);
const sofaSeat = V(0,0,0);
const sofaHeading = Math.PI/2;
const sofaTarget = {name:'居住区のソファ',point:sofaDock,lookAt:V(0,0,0)};
const windows = [
  {kind:'window',name:'北側の窓',point:V(.75,0,-5.38),heading:Math.PI},
  {kind:'window',name:'東側の窓',point:V(5.38,0,.75),heading:Math.PI/2}
];
function randomWindow() {
  const choices = windows.filter(target => target !== roam.target);
  return choices[Math.floor(Math.random()*choices.length)];
}
function lingeringTarget() {
  return {kind:'linger',name:'この場所'};
}
function wanderingTarget() {
  return {kind:'wander',name:'散歩',legs:2+Math.floor(Math.random()*2)};
}
for (const [id,target] of [
  ['wanderPreview',wanderingTarget],['lingerPreview',lingeringTarget],['windowPreview',randomWindow]
]) {
  $(id).onclick = () => {
    if (mode !== 'roam') beginRoam();
    requestDestination(target());
  };
}
const sofaSides = ['P','N'];
const poseJoints = Object.values(groups);
let sofaStand;
let pickableDestinations;

function captureSofaPose() {
  return poseJoints.map(joint => ({
    position:joint.position.clone(),
    rotation:joint.quaternion.clone()
  }));
}

function blendSofaPose(pose, weight) {
  poseJoints.forEach((joint,index) => {
    joint.position.lerp(pose[index].position,weight);
    joint.quaternion.slerp(pose[index].rotation,weight);
  });
}

function initializeSofaMotion() {
  sofaSeat.copy(sofa.localToWorld(V(-.378,.45,.08)));
  sofaDock.copy(sofa.localToWorld(V(-.378,0,.69)));
  sofa.getWorldPosition(sofaTarget.lookAt);
  sofaTarget.lookAt.y = sofaSeat.y;
  sofa.traverse(object => {
    if (object.isMesh) destinationMeshes.set(object,sofaTarget);
  });
  walkTargets.push(sofaTarget);
  pickableDestinations = [...destinationMeshes.keys()];
  travelPose(0);
  sofaStand = captureSofaPose();
}

function routeWalk(from, to, message) {
  const distance = from.distanceTo(to);
  const heading = headingTo(from,to);
  const approach = (startDistance+stopDistance)*transferScale;
  const clipDistance = Math.max(distance,approach+cruiseSpeed*transferScale*walkCycle*.35);
  const cycles = Math.max(1,Math.round((clipDistance-approach)/(cruiseSpeed*transferScale*walkCycle)));
  const duration = cycles*walkCycle;
  return {type:'walk',from,heading,duration,scale:distance/clipDistance,
    speed:routeSpeed({distance:clipDistance,duration},false),
    time:startEnd+duration+clipStop.duration,message};
}

function clearOfPoles(from,to) {
  if (from.distanceToSquared(to) < .000001) return true;
  const segment = new T.Line3(from,to);
  const nearest = V(0,0,0);
  return walkTargets.every(target => {
    if (target === sofaTarget) return true;
    const pole = V(target.lookAt.x,0,target.lookAt.z);
    return segment.closestPointToPoint(pole,true,nearest).distanceToSquared(pole) >= .35**2;
  });
}

function destinationPath(from,to) {
  if (clearOfPoles(from,to)) return [to];
  // Try short detours through the open interior or a known stopping point.
  const waypoints = [V(0,0,0), ...walkTargets.map(target => target.point), ...windows.map(target => target.point)];
  let best = null;
  let bestDistance = Infinity;
  for (const point of waypoints) {
    if (point.distanceToSquared(from) < .025**2 || point.distanceToSquared(to) < .025**2) continue;
    const length = from.distanceTo(point) + point.distanceTo(to);
    if (length < bestDistance && clearOfPoles(from,point) && clearOfPoles(point,to)) {
      best = point;
      bestDistance = length;
    }
  }
  return best ? [best,to] : [];
}

function headingTo(from,to) {
  return Math.atan2(to.x-from.x,to.z-from.z);
}

function headingDelta(from,to) {
  return Math.atan2(Math.sin(to-from),Math.cos(to-from));
}

function routeTurn(heading, message) {
  return {type:'turn',heading,time:1.3,message};
}

function userApproachTarget() {
  const from = root.position;
  const viewer = V(camera.position.x,0,camera.position.z);
  const direction = viewer.clone().sub(from);
  const distance = direction.length();
  if (distance < 1.03 || camera.position.y < .10) return null;
  direction.divideScalar(distance);
  // Use a direct segment so each step closes the distance to the viewer.
  const stride = Math.min(1.10,distance-.76);
  const couchMin = sofaTarget.lookAt.clone().add(V(-.45,-1,-.68));
  const couchMax = sofaTarget.lookAt.clone().add(V(.45,1,.68));
  const couch = new T.Box3(couchMin,couchMax);
  const ray = new T.Ray(from,direction);
  const couchHit = ray.intersectBox(couch,V(0,0,0));
  for (const fraction of [1,.8,.6,.4]) {
    const length = stride*fraction;
    if (length < .24 || couchHit && from.distanceTo(couchHit) < length) continue;
    const point = from.clone().addScaledVector(direction,length);
    if (point.x < -5.65 || point.x > 5.65 || point.z < -5.65 || point.z > 8.65) continue;
    if (clearOfPoles(from,point)) {
      return {kind:'user',name:'ユーザー',point,heading:headingTo(point,viewer)};
    }
  }
  return null;
}

$('approachPreview').onclick = () => {
  if (mode !== 'roam') beginRoam();
  if (roam.target?.kind === 'user' && roam.phase === 'route') return;
  requestDestination({kind:'user',name:'ユーザー'});
};

function requestDestination(target, acknowledge=false) {
  if (roam.phase === 'route') {
    roam.pending = {target,acknowledge};
    const stage = roam.visit[roam.visitIndex];
    if (stage.type === 'walk') {
      // Ease out of the current stride while remaining on its clear path.
      roam.visit[roam.visitIndex] = {
        type:'brake',walk:stage,walkElapsed:roam.elapsed,time:.46,pose:captureSofaPose()
      };
      roam.elapsed = 0;
    }
    $('destination').textContent = '次の行き先　' + target.name;
    return;
  }
  startDestination(target,acknowledge);
}

function startDestination(target, acknowledge=false, seated=roam.phase==='seated') {
  if (target.kind === 'user') {
    const approach = userApproachTarget();
    if (!approach) {
      beginReaction('smallWave');
      return;
    }
    target = approach;
  }
  const message = target.kind === 'wander' ? '気ままに歩いています'
    : target.kind === 'user' ? 'あなたに近付いています'
    : target.kind === 'greeting' ? 'あなたのほうを向いています' : '行き先　' + target.name;
  const from = root.position.clone();
  const visit = [];
  if (seated) visit.push({type:'rise',time:1.55,message:'ソファから立ち上がっています'});
  if (acknowledge) {
    visit.push({type:'look',point:target.lookAt,time:1.45,message:target.name+'を見ています'});
  }
  if (target.kind === 'wander') {
    visit.push({type:'wander',remaining:target.legs,message});
  } else if (target.point && from.distanceTo(target.point) > .025) {
    if (!appendWalk(visit,from,target.point,message,target.kind === 'user')) {
      enterQuietRest('linger','少し立ち止まっています',4);
      return;
    }
  }
  if (target.kind === 'greeting') {
    visit.push(routeTurn(target.heading,message));
  } else if (target.kind === 'window') {
    visit.push(routeTurn(target.heading,'窓の外を見ています'));
  } else if (target === sofaTarget) {
    visit.push(
      routeTurn(sofaHeading,'ソファの前で向きを変えています'),
      {type:'sit',time:1.65,message:'ソファに座っています'}
    );
  }
  roam = {phase:'route',target,visit,visitIndex:0,elapsed:0};
  startRouteStage();
}

function appendWalk(visit,from,to,message,holdCamera=false) {
  const path = destinationPath(from,to);
  let previous = from;
  for (const point of path) {
    const walk = routeWalk(previous,point,message);
    walk.holdCamera = holdCamera;
    visit.push(routeTurn(walk.heading,message),walk);
    previous = point;
  }
  return path.length > 0;
}

function nextWanderPoint(from) {
  const heading = root.rotation.y;
  for (let attempt=0; attempt<18; attempt++) {
    const direction = heading + (Math.random()-.5)*2.7;
    const distance = 1.05 + Math.random()*1.45;
    const point = from.clone().add(V(Math.sin(direction)*distance,0,Math.cos(direction)*distance));
    if (point.x < -2.3 || point.x > 3.6 || point.z < -3.7 || point.z > 4.6) continue;
    if (clearOfPoles(from,point)) return point;
  }
  // Re-enter the room if starting at a window or facing outward at its edge.
  const center = V(.35,0,.15);
  if (from.distanceTo(center) > .5 && destinationPath(from,center).length) return center;
  return null;
}

function routeFootTarget(side, heading) {
  const ankle = V(...defs['foot'+side].slice(1));
  // The right boot sole is slightly lower relative to its rig pivot.
  if (side === 'N') ankle.y += .01;
  return ankle.applyAxisAngle(turnAxis,heading).add(root.position);
}

function startRouteStage() {
  const stage = roam.visit[roam.visitIndex];
  if (!stage) {
    arriveAtDestination();
    return;
  }
  if (stage.type === 'wander') {
    const from = root.position.clone();
    const point = nextWanderPoint(from);
    if (!point || stage.remaining <= 0) {
      arriveAtDestination();
      return;
    }
    const leg = [];
    appendWalk(leg,from,point,stage.message);
    if (stage.remaining > 1) leg.push({...stage,remaining:stage.remaining-1});
    roam.visit.splice(roam.visitIndex,1,...leg);
    startRouteStage();
    return;
  }
  roam.elapsed = 0;
  stage.pose = captureSofaPose();
  if (stage.type === 'look') {
    // A target behind Leila needs a body turn before the eyes can follow it.
    const angle = headingTo(root.position,stage.point);
    const delta = headingDelta(root.rotation.y,angle);
    if (Math.abs(delta) > 1.05) {
      roam.visit.splice(roam.visitIndex,0,routeTurn(angle-Math.sign(delta)*.55,stage.message));
      startRouteStage();
      return;
    }
    const head = groups.head.getWorldPosition(V(0,0,0));
    const direction = stage.point.clone().sub(head);
    direction.applyQuaternion(groups.head.getWorldQuaternion(new T.Quaternion()).invert());
    stage.yaw = T.MathUtils.clamp(Math.atan2(direction.x,direction.z),-1.45,1.45);
    stage.pitch = T.MathUtils.clamp(-Math.atan2(direction.y,Math.hypot(direction.x,direction.z)),-.4,.72);
  }
  if (stage.type === 'turn') {
    stage.angle = root.rotation.y;
    stage.delta = headingDelta(stage.angle,stage.heading);
    if (Math.abs(stage.delta) < .06) {
      root.rotation.y = stage.heading;
      roam.visitIndex++;
      startRouteStage();
      return;
    }
    stage.feet = sofaSides.map(side => groups['foot'+side].getWorldPosition(V(0,0,0)));
    stage.targets = sofaSides.map(side => {
      const ankle = routeFootTarget(side,stage.heading);
      ankle.y = standingAnkleHeights[side];
      return ankle;
    });
  }
  $('destination').textContent = stage.message;
}

function advanceRouteTurn(stage, progress) {
  root.rotation.y = stage.angle + stage.delta*smooth(progress);
  blendSofaPose(sofaStand,1);
  blendSofaPose(stage.pose,1-smooth(Math.min(1,progress*4)));
  sofaSides.forEach((side,index) => {
    const turn = Math.min(1, Math.abs(stage.delta)/.6);
    const step = T.MathUtils.clamp((progress-index*.42)/.58,0,1);
    const goal = stage.feet[index].clone().lerp(stage.targets[index],smooth(step));
    goal.y += .042*turn*Math.sin(Math.PI*step);
    solveLeg(side,goal,stage.angle+stage.delta*smooth(step));
  });
  alignSupportToFloor(1,true);
}

function sitAtSofa(amount, restTime=0) {
  blendSofaPose(sofaStand,1);
  const pelvis = groups.pelvis;
  const lean = Math.sin(Math.PI*amount);
  pelvis.position.y = T.MathUtils.lerp(pelvis.position.y,sofaSeat.y+.052,amount);
  pelvis.position.z = T.MathUtils.lerp(pelvis.position.z,sofaSeat.x-sofaDock.x,amount)+.03*lean;
  pelvis.position.x *= 1-amount;
  pelvis.rotateX(.12*lean);
  groups.abdomen.rotateX(.24*lean);
  groups.chest.rotateX(.12*lean-.055*amount);
  groups.head.rotateX(-.15*lean+.025*amount);
  groups.head.rotateY(.1*Math.sin(restTime*1.3)*amount);
  sofaSides.forEach((side,index) => {
    const upper = groups['upper'+side];
    const elbow = groups['elbow'+side];
    const sign = index === 0 ? 1 : -1;
    upper.rotateZ(sign*.12*amount);
    upper.rotateX(.26*amount);
    elbow.rotateX(-1.04*amount);
  });
  const feet = sofaSides.map(side => {
    const ankle = routeFootTarget(side,sofaHeading);
    ankle.y = standingAnkleHeights[side];
    return {side,ankle};
  });
  lowerPelvisForFeet(feet);
  for (const {side,ankle} of feet) solveLeg(side,ankle,sofaHeading);
}

function applyRouteLook(stage, progress) {
  blendSofaPose(stage.pose,1);
  const weight = smooth(Math.min(1,progress/.28,(1-progress)/.18));
  groups.neck.rotateY(stage.yaw*.22*weight);
  groups.head.rotateY(stage.yaw*.78*weight);
  groups.head.rotateX(stage.pitch*weight);
  const nod = T.MathUtils.clamp((progress-.38)/.39,0,1);
  groups.head.rotateX(.25*Math.sin(Math.PI*nod)**2);
}

function walkingContactWeight(stage,time) {
  const stopStart = startEnd + stage.duration;
  // Keep support through the whole start/stop clips. Fade only at the joins.
  const takeoff = 1-smooth(T.MathUtils.clamp((time-startEnd)/blendDuration,0,1));
  const landing = 1-smooth(T.MathUtils.clamp((stopStart-time)/blendDuration,0,1));
  return Math.max(takeoff,landing);
}

function shoeFloorHeight({foot,vertices},heelOnly=false) {
  foot.updateWorldMatrix(true,false);
  const m = foot.matrixWorld.elements;
  let lowest = Infinity;
  for (let i=0; i<vertices.length; i+=3) {
    if (heelOnly && vertices[i+2] > 0) continue;
    const height = m[1]*vertices[i] + m[5]*vertices[i+1] + m[9]*vertices[i+2] + m[13];
    if (height < lowest) lowest = height;
  }
  return lowest;
}

function lowerSupportingHeels(amount=1) {
  if (amount <= 0) return;
  const heights = shoeContactGeometry.map(shoe => shoeFloorHeight(shoe));
  const lowest = Math.min(...heights);
  if (!Number.isFinite(lowest)) return;
  for (const [index,{foot}] of shoeContactGeometry.entries()) {
    const weight = amount*(1-smooth(T.MathUtils.clamp((heights[index]-lowest)/.055,0,1)));
    if (weight <= 0) continue;
    const rotation = foot.getWorldQuaternion(new T.Quaternion());
    const ankle = new T.Euler().setFromQuaternion(rotation,'YXZ');
    ankle.x *= 1-weight;
    ankle.z *= 1-weight;
    const parent = foot.parent.getWorldQuaternion(new T.Quaternion()).invert();
    foot.quaternion.copy(parent.multiply(rotation.setFromEuler(ankle)));
  }
}

function alignSupportToFloor(weight=1,heelOnly=false) {
  if (weight <= 0) return;
  const lowest = Math.min(...shoeContactGeometry.map(shoe => shoeFloorHeight(shoe,heelOnly)));
  if (Number.isFinite(lowest)) groups.pelvis.position.y -= lowest*weight;
}

function advanceDestinationRoute(dt) {
  const stage = roam.visit[roam.visitIndex];
  roam.elapsed = Math.min(stage.time,roam.elapsed+dt);
  const progress = roam.elapsed/stage.time;
  switch (stage.type) {
    case 'walk':
      travelPose(roam.elapsed,stage.duration,0,stage.heading,false,stage.speed,0,stage);
      blendSofaPose(stage.pose,1-smooth(Math.min(1,roam.elapsed/.34)));
      alignSupportToFloor(walkingContactWeight(stage,roam.elapsed),true);
      break;
    case 'turn':
      advanceRouteTurn(stage,progress);
      break;
    case 'brake': {
      const walk = stage.walk;
      const extra = stage.time*progress*(1-progress/2);
      const time = Math.min(walk.time,stage.walkElapsed+extra);
      travelPose(time,walk.duration,0,walk.heading,false,walk.speed,0,walk);
      blendSofaPose(stage.pose,1-smooth(Math.min(1,progress/.28)));
      blendSofaPose(sofaStand,smooth(progress));
      lowerSupportingHeels(smooth(progress));
      const contact = walkingContactWeight(walk,stage.walkElapsed);
      alignSupportToFloor(T.MathUtils.lerp(contact,1,smooth(progress)),true);
      break;
    }
    case 'look':
      applyRouteLook(stage,progress);
      break;
    case 'sit':
      sitAtSofa(smooth(progress));
      if (roam.elapsed < .23) {
        blendSofaPose(stage.pose,1-smooth(roam.elapsed/.23));
        alignSupportToFloor();
      }
      break;
    case 'rise':
      sitAtSofa(1-smooth(progress));
      break;
  }
  if (progress < 1) return;
  if (roam.pending) {
    const {target,acknowledge} = roam.pending;
    startDestination(target,acknowledge,stage.type==='sit');
    return;
  }
  roam.visitIndex++;
  startRouteStage();
}

function enterQuietRest(phase,message,pause) {
  roam.phase = phase;
  roam.elapsed = 0;
  roam.pause = pause;
  roam.quietEntryPose = captureSofaPose();
  settleStandingFeet();
  roam.quietPose = captureSofaPose();
  blendSofaPose(roam.quietEntryPose,1);
  roam.quietMessage = message;
  roam.attention = null;
  $('destination').textContent = message;
}

function lowerPelvisForFeet(feet) {
  let drop = 0;
  for (const {side,ankle} of feet) {
    const hip = groups['thigh'+side].getWorldPosition(V(0,0,0));
    const reach = base['knee'+side].length() + base['foot'+side].length() - .006;
    const horizontal = (hip.x-ankle.x)**2 + (hip.z-ankle.z)**2;
    const verticalReach = Math.sqrt(Math.max(0,reach**2-horizontal));
    drop = Math.max(drop,hip.y-ankle.y-verticalReach);
  }
  groups.pelvis.position.y -= drop;
}

function settleStandingFeet() {
  const heading = root.rotation.y;
  const feet = sofaSides.map(side => {
    const ankle = groups['foot'+side].getWorldPosition(V(0,0,0));
    ankle.y = standingAnkleHeights[side];
    return {side,ankle};
  });
  lowerPelvisForFeet(feet);
  for (const {side,ankle} of feet) solveLeg(side,ankle,heading);
}

function applyQuietPose() {
  blendSofaPose(roam.quietPose,1);
  const time = roam.elapsed;
  const settle = smooth(Math.min(1,time/.48));
  blendSofaPose(roam.quietEntryPose,1-settle);
  if (settle < 1) alignSupportToFloor();
  const fade = smooth(Math.min(1,time/1.25));
  const breathe = Math.sin(time*1.7)*.014*fade;
  groups.chest.rotateX(breathe);
  if (roam.phase === 'window') {
    // Gently scan the horizon, then look a little higher.
    groups.neck.rotateY(.09*Math.sin(time*.7)*fade);
    groups.head.rotateY(.23*Math.sin(time*.7)*fade);
    groups.head.rotateX((-.075+.08*Math.sin(time*.51))*fade);
  } else {
    groups.head.rotateX((.06+breathe)*fade);
  }
}

function arriveAtDestination() {
  roam.elapsed = 0;
  if (roam.target.kind === 'user' || roam.target.kind === 'greeting') {
    const target = roam.target;

    enterQuietRest('linger',approached ? 'あなたの近くで立ち止まっています' : 'あなたのほうを向いています',5+Math.random()*3);
    if (!reaction?.fromTap) beginReaction(approached
      ? (currentMood() === 'affectionate' ? 'beckon' : 'smallWave') : target.gesture);
    return;
  }
  if (roam.target.kind === 'window') {
    enterQuietRest('window','窓の外を眺めています',10+Math.random()*8);
    return;
  }
  if (roam.target.kind === 'linger' || roam.target.kind === 'wander') {
    enterQuietRest('linger','ぼんやり立っています',7+Math.random()*9);
    return;
  }
  if (roam.target === sofaTarget) {
    roam.phase = 'seated';
    roam.pause = 6 + Math.random()*4;
    $('destination').textContent = 'ソファで休憩中';
    return;
  }
  roam.heading = root.rotation.y;
  roam.phase = 'rest';
  roam.pause = 4 + Math.random()*3;
  const roll = Math.random();
  const clip = idleClips[roll<.32 ? 0 : roll<.64 ? 1 : roll<.82 ? 2 : 3];
  const offset = Math.random()*Math.max(0,clip.duration-roam.pause);
  const rotations = Object.fromEntries(capturedWalk.joints.map(key=>[key,groups[key].quaternion.clone()]));
  const preview = $('jokePreview');
  const joke = preview.value === ''
    ? (Math.random()<.24 ? jokes[Math.floor(Math.random()*jokes.length)] : null)
    : jokes[Number(preview.value)];
  preview.value = '';
  roam.idle = {
    clip,offset,rotations,joke,
    center:clip.hips[Math.round(offset*clip.fps)],
    pelvis:groups.pelvis.position.clone(),
    scan:Math.random()<.55 ? (Math.random()<.5 ? -1 : 1) : 0,
    scanStart:.7+Math.random()*.7,
    jokeStart:.85+Math.random()*.5
  };
  if (joke) roam.pause = Math.max(roam.pause,roam.idle.jokeStart+jokeDuration+.25);
  roam.glanceAt = !joke && Math.random()<.65 ? 1.2+Math.random()*1.8 : Infinity;
  $('destination').textContent = roam.target.name + 'に到着・休憩中';
}

const danceIds = Object.keys(danceClips);
const danceCrossfade = .48;
const danceEntryTime = .55;
let dance;
const fadeAmount = value => smooth(T.MathUtils.clamp(value,0,1));

function nextDanceId() {
  if (!dance.queue.length) {
    dance.queue = danceIds.slice();
    for (let i=dance.queue.length-1; i>0; i--) {
      const j=Math.floor(Math.random()*(i+1));

    }
    if (dance.queue.at(-1) === dance.id) {
      [dance.queue[0],dance.queue[dance.queue.length-1]] =
        [dance.queue[dance.queue.length-1],dance.queue[0]];
    }
  }
  return dance.queue.pop();
}

function beginDance(kind,id=null) {
  const entry = captureSofaPose();
  if (kind !== 'auto') {
    resetTravel();
  }
  mode = 'dance';
  dance = {
    kind, entry, anchor:root.position.clone(), heading:root.rotation.y,
    elapsed:0, entryElapsed:0, queue:[], id,
    remaining:kind==='auto' ? 2+Math.floor(Math.random()*2) : Infinity
  };
  dance.id ??= nextDanceId();
  showDanceTitle();
}

function showDanceTitle() {
  const title = 'Hip Hop Dancing ' + dance.id;
  $('destination').textContent = dance.kind==='auto' ? '気分でダンス · '+title : title;
}

function canDanceHere() {
  const {x,z}=root.position;
  if (x < -1.15 || x > 3.8 || z < -3 || z > 5.5) return false;
  return walkTargets.every(target=>Math.hypot(x-target.lookAt.x,z-target.lookAt.z)>1.30);
}

$('dancePlay').onclick = () => beginDance('single',$('danceClip').value || danceIds[0]);

};

function sampleDance(clip,time) {
  const {fps,joints,rotations,hips,ground}=clip;
  const [a,b,weight] = sampleIndices(Math.min(time,clip.duration)*fps,hips.length,false);
  for (const key in groups) {
    groups[key].position.copy(base[key]);
    groups[key].quaternion.identity();
  }
  const displacement=hips[a].clone().lerp(hips[b],weight).sub(hips[0]).multiplyScalar(transferScale);
  displacement.applyAxisAngle(turnAxis,dance.heading);
  groups.pelvis.position.y += displacement.y;
  for (const [index,key] of joints.entries()) {
    const joint = groups[key];
    travelJoint.copy(rotations[a][index]).slerp(rotations[b][index],weight);
    joint.parent.getWorldQuaternion(walkParent).invert();
    joint.quaternion.copy(walkParent.multiply(travelJoint));
  }
  return {offset:displacement,ground:Math.max(0,mix(ground[a],ground[b],weight))*transferScale};
}

function beginDanceOutro() {
  if (dance.outro) return;
  const pose = captureSofaPose();
  blendSofaPose(sofaStand,1);
  settleStandingFeet();
  dance.outro = {pose,standing:captureSofaPose(),elapsed:0};
  blendSofaPose(pose,1);
  $('destination').textContent = 'ダンスを終えています';
}

function advanceDance(dt) {
  if (dance.outro) {
    const outro=dance.outro;
    outro.elapsed+=dt;
    const weight=fadeAmount(outro.elapsed/.5);
    blendSofaPose(outro.standing,1);
    blendSofaPose(outro.pose,1-weight);
    alignSupportToFloor();
    if (weight>=1) {
      mode='roam';
      roam = {phase:'linger',target:null};
      chooseDestination();
    }
    return;
  }
  if (dance.finished) return;
  dance.elapsed+=dt;
  dance.entryElapsed+=dt;
  const clip=danceClips[dance.id];
  const overlapStart=clip.duration-danceCrossfade;
  const nextTime=dance.elapsed-overlapStart;
  const sample=sampleDance(clip,dance.elapsed);
  if (dance.kind!=='single' && dance.remaining>1 && nextTime>=0) {
    dance.next ??= nextDanceId();
    const outgoing=captureSofaPose();
    const incoming=sampleDance(danceClips[dance.next],nextTime);
    const blend=fadeAmount(nextTime/danceCrossfade);
    blendSofaPose(outgoing,1-blend);
    sample.offset.lerp(incoming.offset,blend);
    sample.ground=mix(sample.ground,incoming.ground,blend);
  }
  const entryWeight=fadeAmount(dance.entryElapsed/danceEntryTime);
  if (entryWeight<1) {
    blendSofaPose(dance.entry,1-entryWeight);
    sample.offset.multiplyScalar(entryWeight);
    sample.ground*=entryWeight;
  }
  setTravelPosition(dance.anchor.x+sample.offset.x,dance.anchor.z+sample.offset.z);
  alignSupportToFloor();
  groups.pelvis.position.y+=sample.ground;

  if (dance.elapsed<clip.duration) return;
  if (dance.next) {
    dance.id=dance.next;
    dance.next=null;
    dance.elapsed=nextTime;
    dance.remaining--;
    showDanceTitle();
  } else if (dance.kind==='auto') {
    beginDanceOutro();
  } else {
    dance.finished=true;
    $('destination').textContent = 'ダンス試演終了';
  }
}
