let handLink = null;
const handLinkRay = new T.Raycaster();
const handLinkScreen = new T.Vector2();
const handLinkGoal = new T.Vector3();
const handLinkWrist = new T.Vector3();
const handLinkOffset = new T.Vector3();
const handLinkNormal = new T.Vector3();
const handLinkShoulder = new T.Vector3();
const handLinkPalmNormal = new T.Vector3();

function handLinkPolicy(feeling,distance,reach) {
  if (distance <= reach) return 'reach';
  if (feeling === 'happy' || feeling === 'affectionate') return 'follow';
  if (feeling === 'annoyed' || distance > reach+.085) return 'release';
  return 'reach';
}

function endHandLink(resume=true) {
  if (!handLink) return;
  const {resumeRoam} = handLink;
  const releasePose = mode === 'standWait' ? captureSofaPose() : null;
  handLink = null;
  if (mode !== 'standWait') return;
  if (resume && resumeRoam) {
    touchPause.until = mood.seconds+.75;
    beginRoam();
    roam.handRelease = {pose:releasePose,time:0};
  } else {
    standingWait.entry = releasePose;
    standingWait.elapsed = 0;
    $('destination').textContent = 'その場で待機中';
  }
}

function moveHeldHand(event,current) {
  if (handLink?.contact === current) {
    handLink.x = event.clientX;
    handLink.y = event.clientY;
    return;
  }
  if (current.linkStarted || !/^(hand|fore)[PN]$/.test(current.path[0].id)) return;
  if (Math.hypot(event.clientX-current.x,event.clientY-current.y) <= touchMotion) return;
  if (moodSituation() === 'focused' || mode === 'roam' && roam.phase === 'seated') return;

  const side = current.path[0].id.at(-1);
  const resumeRoam = mode === 'roam';
  const entry = captureSofaPose();
  const plane = new T.Plane().setFromNormalAndCoplanarPoint(
    camera.getWorldDirection(handLinkNormal),current.hit.point);
  beginStandingWait(false);
  standingWait.entry = entry;
  handLink = {contact:current,side,resumeRoam,plane,x:event.clientX,y:event.clientY,
    age:0,gait:0,walkBlend:0,currentGoal:current.hit.point.clone(),blocked:0,
    shoulderPull:new T.Vector3(),bodyPull:new T.Vector3(),pullTime:0,pullAmount:0};
  current.linkStarted = true;
  $('destination').textContent = '手をつないでいます';
}

function handLinkFinger(link, out) {
  const rect = canvas.getBoundingClientRect();
  const x = T.MathUtils.clamp(link.x,rect.left,rect.right);
  const y = T.MathUtils.clamp(link.y,rect.top,rect.bottom);
  handLinkScreen.set(2*(x-rect.left)/rect.width-1,1-2*(y-rect.top)/rect.height);
  camera.updateWorldMatrix(true,false);
  handLinkRay.setFromCamera(handLinkScreen,camera);
  return handLinkRay.ray.intersectPlane(link.plane,out);
}

const handPullDelay = .27;

function advanceHandPull(link,dt,stretch) {
  // Feet remain planted until the resistance has had time to travel up the arm.
  if (stretch > 0) link.pullTime = Math.min(.65,link.pullTime+dt);
  else if (stretch < -.022) link.pullTime = Math.max(0,link.pullTime-dt*2.8);
  const desired = stretch > 0 ? Math.max(.65,T.MathUtils.clamp(stretch/.14,0,1)) : 0;
  const ramp = Math.min(1,link.pullTime/handPullDelay);
  link.pullAmount = mix(link.pullAmount,desired*ramp,1-Math.exp(-dt*15));
  return link.pullTime >= handPullDelay;
}

function walkWithHeldHand(link,dt,stretch) {
  const heading = headingTo(root.position,link.currentGoal);
  const speed = T.MathUtils.clamp(.20+stretch*2.0,.20,.68)
    * (.35+.65*rearRamp(link.pullTime,handPullDelay,handPullDelay+.19));
  const length = Math.min(speed*dt,Math.max(.004,stretch*.25));
  const next = V(Math.sin(heading)*length,0,Math.cos(heading)*length).add(root.position);
  const couch = new T.Box3(sofaTarget.lookAt.clone().add(V(-.57,-2,-.79)),
    sofaTarget.lookAt.clone().add(V(.57,2,.79)));
  if (next.x < -5.65 || next.x > 5.65 || next.z < -5.65 || next.z > 8.65 ||
      couch.containsPoint(next) || !clearOfPoles(root.position,next)) return 0;
  const turn = headingDelta(root.rotation.y,heading);
  root.rotation.y += T.MathUtils.clamp(turn,-dt*3.2,dt*3.2);
  // Keep the camera fixed while she closes the gap to the finger.
  setTravelPosition(next.x,next.z,true);
  return speed;
}

const handLinkBodyTarget = new T.Vector3();
const handLinkShoulderOffset = new T.Vector3();
const guardedWrist = new T.Vector3();

function applyHandLinkBody(link,dt) {
  root.worldToLocal(handLinkBodyTarget.copy(link.currentGoal));
  const local = handLinkBodyTarget;
  const side = link.side === 'P' ? 1 : -1;
  const sidePull = T.MathUtils.clamp((local.x-side*.10)/.27,-1,1);
  const forwardPull = T.MathUtils.clamp((local.z-.06)/.23,-1,1);
  const verticalPull = T.MathUtils.clamp((local.y-.60)/.24,-1,1);
  const shoulderPull = link.shoulderPull;
  const bodyPull = link.bodyPull;
  shoulderPull.lerp(handLinkShoulderOffset.set(sidePull,verticalPull,forwardPull),1-Math.exp(-dt*12));
  bodyPull.lerp(shoulderPull,1-Math.exp(-dt*5));
  const weight = rearRamp(link.age,0,.30);
  const pull = (link.pullAmount ?? 0)*weight*(1-.56*link.walkBlend);
  const abdomen = groups.abdomen;
  const chest = groups.chest;
  abdomen.rotateY(bodyPull.x*.21*weight);
  abdomen.rotateZ(-bodyPull.x*.09*weight-sidePull*.19*pull);
  abdomen.rotateX((bodyPull.z*.08-bodyPull.y*.027)*weight+forwardPull*.18*pull);
  chest.rotateY(shoulderPull.x*.22*weight);
  chest.rotateZ(-shoulderPull.x*.095*weight-sidePull*.13*pull);
  chest.rotateX((shoulderPull.z*.07-shoulderPull.y*.046)*weight+forwardPull*.095*pull);
  const upper = groups['upper'+link.side];
  upper.position.x += shoulderPull.x*.008*weight;
  upper.position.y += shoulderPull.y*.012*weight;
  upper.position.z += shoulderPull.z*.017*weight;
  groups.neck.rotateY(-bodyPull.x*.12*weight);
  groups.head.rotateY(-shoulderPull.x*.13*weight);
}

function boundHeldWrist(side,point) {
  const sign = side === 'P' ? 1 : -1;
  const lateral = T.MathUtils.clamp(sign*point.x,-.13,.25);
  point.x = sign*lateral;
  point.y = T.MathUtils.clamp(point.y,-.31,.165);
  // Crossing in front of the chest requires more clearance than reaching to the side.
  const across = 1-T.MathUtils.smoothstep(lateral,-.073,.082);
  const inside = 1-T.MathUtils.smoothstep(lateral,.074,.142);
  const frontEdge = .074+.047*across;
  point.z = T.MathUtils.clamp(point.z,mix(-.075,frontEdge,inside),.32);
  return point;
}

function solveHeldHand(side,target,orientation,weight) {
  groups.chest.worldToLocal(guardedWrist.copy(target));
  boundHeldWrist(side,guardedWrist);
  groups.chest.localToWorld(guardedWrist);
  reachHand(side,guardedWrist,orientation,weight,true);
}

function advanceHandLink(dt) {
  const link = handLink;
  if (!link) return;
  link.age += dt;
  advanceStandingWait(dt);
  if (!handLinkFinger(link,handLinkGoal)) return;
  handLinkGoal.y = T.MathUtils.clamp(handLinkGoal.y,.40,.89);
  link.currentGoal.lerp(handLinkGoal,1-Math.exp(-dt*16));
  const side = link.side;
  groups['upper'+side].getWorldPosition(handLinkShoulder);
  const distance = handLinkShoulder.distanceTo(link.currentGoal);
  const reach = base['elbow'+side].length()+base['hand'+side].length()+.024;
  const stretch = distance-reach;
  const policy = handLinkPolicy(currentMood(),distance,reach);
  const ready = advanceHandPull(link,dt,stretch);
  const following = policy === 'follow' && ready;
  const speed = following ? walkWithHeldHand(link,dt,stretch) : 0;
  link.blocked = following && !speed ? link.blocked+dt : 0;
  const releasing = policy === 'release' && ready || link.blocked > .60;
  link.walkBlend = mix(link.walkBlend,speed ? 1 : 0,1-Math.exp(-dt*9));
  if (link.walkBlend > .015) {
    link.gait += dt*(speed ? T.MathUtils.clamp(speed/.33,.58,1.65) : .60);
    const heading = root.rotation.y;
    root.rotation.y = 0;
    mixamoPose(link.gait);
    root.rotation.y = heading;
    blendSofaPose(standingWaitPose,1-link.walkBlend);
    alignSupportToFloor(1,true);
  }

  applyHandLinkBody(link,dt);
  palmForward.copy(camera.position).sub(link.currentGoal);
  palmForward.y = 0;
  if (palmForward.lengthSq() < .00001) palmForward.set(Math.sin(root.rotation.y),0,Math.cos(root.rotation.y));
  palmForward.normalize();
  // Turn both palms inward with the thumbs up, as when shaking hands.
  handLinkPalmNormal.crossVectors(palmUp,palmForward).multiplyScalar(side === 'P' ? -1 : 1);
  const palmOrientation = orientPalm(side,palmForward,handLinkPalmNormal);
  handLinkWrist.copy(link.currentGoal).sub(handLinkOffset.copy(palmRig[side].center).applyQuaternion(palmOrientation));
  const weight = rearRamp(link.age,0,.22);
  if (!solveHeldHand(side,handLinkWrist,palmOrientation,weight)) {
    // Stay on the held side if no forward route around the chest is available.
    const fallback = groups.chest.localToWorld(handLinkWrist.set(side === 'P' ? .16 : -.16,-.13,.11));
    reachHand(side,fallback,palmOrientation,weight,true);
  }
  if (releasing) {
    // Capture the pulled pose so the body eases back after she lets go.
    endHandLink();
    beginReaction('armWithdraw',false,side);
  }
}

for(const side of ['P','N']){const g=gait((phase+(side==='N'?.5:0))%1,Math.min(1.15,style));let f=feet[side];for(const k of ['z','lift','pitch'])f[k]=g[k]*cur.step;f.inward=.014*cur.step; if($('ik').checked)leg(side,f.lift,f.z,f.inward,f.pitch,0,.025);else if(cur.step>.001){groups['thigh'+side].rotation.x=-f.z*4;groups['knee'+side].rotation.x=-f.lift*8;}}
